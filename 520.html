<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爱心表白便签</title>
    <script src="js/111.js"></script>
    <link href="css/111.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background-color: #fdf2f7;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            transition: background-color 0.5s ease;
        }

        .start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #fdf2f7;
            z-index: 100;
            transition: opacity 0.8s ease;
        }

        .love-note {
            position: absolute;
            width: 100px;
            height: 100px;
            background-color: #f43f5e;
            transform: rotate(45deg) scale(0);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.17, 0.89, 0.32, 1.49);
            z-index: 10;
        }

        .love-note::before,
        .love-note::after {
            content: "";
            position: absolute;
            width: 100px;
            height: 100px;
            background-color: inherit;
            border-radius: 50%;
        }

        .love-note::before {
            top: -50px;
            left: 0;
        }

        .love-note::after {
            top: 0;
            left: -50px;
        }

        .note-text {
            position: relative;
            z-index: 20;
            font-family: 'Arial Rounded MT Bold', sans-serif;
            font-size: 14px;
            color: white;
            text-align: center;
            transform: rotate(-45deg);
            width: 80px;
            line-height: 1.3;
        }

        .love-note.show {
            opacity: 0.9;
            transform: rotate(45deg) scale(1);
        }

        /* 不同颜色的爱心便签 */
        .color-1 { background-color: #f43f5e; }
        .color-2 { background-color: #ec4899; }
        .color-3 { background-color: #8b5cf6; }
        .color-4 { background-color: #ec4899; }
        .color-5 { background-color: #f97316; }
    </style>
</head>
<body>
    <div class="start-screen">
        <i class="fa fa-heart text-6xl text-pink-500 mb-6 animate-pulse"></i>
        <h1 class="text-3xl md:text-4xl font-bold text-pink-700 mb-4">给你的一封信</h1>
        <p class="text-pink-600 max-w-md text-center px-4">你他M给我看！！！</p>

			"把想念藏进风里，吹向你",
			"日子平淡，好在我喜欢的人都在心里",
			"见字如面，愿你安好",
			"思念是一场漫长的温柔",
			"想你这件事，偷偷进行中",
			"今日份想念，已送达",

		];

        const startScreen = document.querySelector('.start-screen');
        const body = document.body;
        let hasClicked = false;

        // 点击事件处理
        body.addEventListener('click', () => {
            if (hasClicked) return;
            hasClicked = true;

            // 隐藏开始屏幕
            startScreen.style.opacity = '0';
            setTimeout(() => {
                startScreen.style.display = 'none';
            }, 800);

            // 依次创建并显示爱心便签
            loveMessages.forEach((message, index) => {
                setTimeout(() => {
                    createLoveNote(message);
                }, index * 200); // 0.2秒间隔
            });
        });

        // 创建爱心便签函数
        function createLoveNote(message) {
            // 创建元素
            const note = document.createElement('div');
            const text = document.createElement('div');
            
            // 设置类名和内容
            const colorClass = `color-${Math.floor(Math.random() * 5) + 1}`;
            note.className = `love-note ${colorClass}`;
            text.className = 'note-text';
            text.textContent = message;
            
            note.appendChild(text);
            body.appendChild(note);

            // 随机位置
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;
            const noteSize = 100;
            
            // 确保便签完全显示在屏幕内
            const maxX = screenWidth - noteSize;
            const maxY = screenHeight - noteSize;
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            
            note.style.left = `${randomX}px`;
            note.style.top = `${randomY}px`;

            // 触发显示动画
            setTimeout(() => {
                note.classList.add('show');
            }, 50);

            // 添加轻微浮动效果
            addFloatAnimation(note);
        }

        // 添加浮动动画
        function addFloatAnimation(element) {
            let angle = 0;
            const originalTop = parseInt(element.style.top);
            
            setInterval(() => {
                angle += 0.02;
                const floatY = Math.sin(angle) * 8; // 上下浮动距离
                element.style.top = `${originalTop + floatY}px`;
            }, 50);
        }
    </script>
</body>
</html>
